<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bambu Monitor · Einrichtung</title>
<style>
  /* Same tokens as the dashboard, minus everything this page does not need.
     Standalone on purpose: it runs before the app has a database, so it cannot
     depend on anything the dashboard loads. */
  :root{
    --bg:#f6f7f9; --surface:#fff; --surface-2:#fff; --border:#e2e5ea;
    --text:#1b1e24; --text-2:#4a5160; --text-3:#7c8494;
    --accent:#3b6ea8; --accent-ink:#fff; --ok:#2e7d55; --danger:#c0392b;
    --warn:#b5761f; --shadow:0 1px 2px rgba(16,20,28,.06);
    --radius:14px;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){}
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1c1b22; --surface:#25242c; --surface-2:#2b2a33; --border:#3a3944;
      --text:#fbfbfe; --text-2:#cfcfd8; --text-3:#8f8f9d;
      --accent:#7aa2d6; --accent-ink:#15141a; --ok:#54b98a; --danger:#ff6b6b;
      --warn:#e0a458; --shadow:0 1px 2px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text); font-size:15px;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    line-height:1.5; padding:28px 20px 60px;
  }
  .wrap{max-width:820px; margin:0 auto}
  header{display:flex; align-items:center; gap:14px; margin-bottom:22px}
  .logo{
    width:44px; height:44px; border-radius:13px; display:grid; place-items:center;
    background:var(--surface); border:1px solid var(--border); font-size:22px;
  }
  h1{font-size:20px; margin:0; font-weight:650; letter-spacing:-.02em}
  .sub{font-size:12.5px; color:var(--text-3)}
  .grow{flex:1}
  .seg{display:inline-flex; background:var(--surface); border:1px solid var(--border);
       border-radius:999px; padding:3px}
  .seg button{
    border:0; background:none; color:var(--text-3); font:inherit; font-size:12px;
    font-weight:600; padding:5px 11px; border-radius:999px; cursor:pointer;
  }
  .seg button.on{background:var(--accent); color:var(--accent-ink)}

  /* the step rail: where you are, and what is still to come */
  .rail{display:flex; gap:0; margin-bottom:20px; flex-wrap:wrap}
  .rail div{
    flex:1; min-width:120px; padding:9px 12px; font-size:12.5px; font-weight:600;
    color:var(--text-3); border-bottom:2px solid var(--border);
  }
  .rail div.on{color:var(--text); border-bottom-color:var(--accent)}
  .rail div.done{color:var(--ok); border-bottom-color:var(--ok)}
  .rail span{display:inline-block; width:19px; height:19px; border-radius:50%;
    background:var(--border); color:var(--text-2); font-size:11px; text-align:center;
    line-height:19px; margin-right:7px}
  .rail div.on span{background:var(--accent); color:var(--accent-ink)}
  .rail div.done span{background:var(--ok); color:#fff}

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:22px 24px;
  }
  .card h2{font-size:16px; margin:0 0 4px; font-weight:650}
  .lede{color:var(--text-2); font-size:13.5px; margin:0 0 18px}

  .row{display:grid; grid-template-columns:230px 1fr; gap:14px; align-items:start;
       padding:11px 0; border-top:1px solid var(--border)}
  .row:first-of-type{border-top:0}
  .row > label{font-size:13px; font-weight:600; color:var(--text-2); padding-top:8px}
  .row .note{font-size:12px; color:var(--text-3); margin-top:5px}
  .grp{font-size:11.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
       color:var(--text-3); margin:22px 0 2px}
  input:not([type=checkbox]),select{
    width:100%; padding:9px 12px; font:inherit; font-size:14px; color:var(--text);
    background:var(--surface-2); border:1px solid var(--border); border-radius:9px;
  }
  input:focus,select:focus{outline:2px solid var(--accent); outline-offset:-1px}
  .pair{display:flex; gap:9px} .pair input:first-child{flex:1}
  .pair input:last-child{width:120px}
  input[type=checkbox]{width:17px; height:17px; accent-color:var(--accent)}
  .mtx-row{display:flex; gap:8px; margin-bottom:7px}
  .mtx-row input:first-child{flex:1}
  .mtx-row input:nth-child(2){width:130px}
  .btn{
    border:1px solid var(--border); background:var(--surface-2); color:var(--text);
    font:inherit; font-size:13.5px; font-weight:600; padding:9px 16px;
    border-radius:9px; cursor:pointer;
  }
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
  .btn.small{padding:6px 11px; font-size:12.5px}
  .btn:disabled{opacity:.5; cursor:default}
  .foot{display:flex; gap:10px; align-items:center; margin-top:24px;
        padding-top:18px; border-top:1px solid var(--border)}
  .msg{font-size:13px; padding:10px 13px; border-radius:9px; margin:14px 0 0;
       border:1px solid var(--border); background:var(--surface-2); white-space:pre-wrap}
  .msg.ok{border-color:var(--ok); color:var(--ok)}
  .msg.bad{border-color:var(--danger); color:var(--danger)}
  .msg.warn{border-color:var(--warn); color:var(--warn)}
  .msg:empty{display:none}
  .hide{display:none !important}
  ul.errs{margin:6px 0 0; padding-left:20px}
  code{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12.5px}
  @media(max-width:640px){ .row{grid-template-columns:1fr} .row > label{padding-top:0} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🖨</div>
    <div>
      <h1>Bambu Monitor</h1>
      <div class="sub" id="lede">Einrichtung</div>
    </div>
    <div class="grow"></div>
    <span class="seg" id="langSeg">
      <button data-lang="de" class="on">DE</button><button data-lang="en">EN</button>
    </span>
  </header>

  <div class="rail" id="rail"></div>
  <div class="card">
    <h2 id="stepTitle"></h2>
    <p class="lede" id="stepLede"></p>
    <div id="stepBody"></div>
    <div class="msg" id="stepMsg"></div>
    <div class="foot">
      <button class="btn" id="backBtn">Zurück</button>
      <div class="grow"></div>
      <button class="btn" id="testBtn">Verbindung testen</button>
      <button class="btn primary" id="nextBtn">Weiter</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

/* German is the default, as on the dashboard. The schema's labels arrive in
   English, so they are translated here alongside this page's own strings. */
const DE = {
  "Setup":"Einrichtung",
  "Back":"Zurück", "Next":"Weiter", "Finish":"Fertigstellen", "Test connection":"Verbindung testen",
  "Test printer":"Drucker testen", "Testing…":"Teste…", "Skip":"Überspringen",
  "Database":"Datenbank", "Printer":"Drucker", "Plug, cloud & camera":"Steckdose, Cloud & Kamera",
  "Stored in":"Gespeichert in",
  "This follows the app folder - move the app and the file moves with it. Nothing else is written outside the database.":
    "Das folgt dem App-Ordner – verschiebst du die App, wandert die Datei mit. Sonst wird außerhalb der Datenbank nichts geschrieben.",
  "Costs & filament":"Kosten & Filament", "Recording & safety":"Aufzeichnung & Sicherheit",
  "Recording":"Aufzeichnung", "Controls":"Steuerung",
  "How much is recorded, and what the app may do":"Wie viel aufgezeichnet wird – und was die App darf",
  "The defaults suit a printer in regular use. The two switches at the bottom stay off unless you have a reason.":
    "Die Standardwerte passen für einen normal genutzten Drucker. Die beiden Schalter unten bleiben aus, wenn du keinen Grund hast.",
  "Where everything is stored":"Wo alles gespeichert wird",
  "This is the one thing that cannot live in the database, so it is written to a small file the app creates for you. Everything else on the following pages goes into the database and can be changed later from the Settings page.":
    "Das ist das Einzige, was nicht in der Datenbank liegen kann – es wird in eine kleine Datei geschrieben, die die App selbst anlegt. Alles Weitere auf den nächsten Seiten landet in der Datenbank und lässt sich später über die Einstellungen ändern.",
  "MariaDB":"MariaDB", "MySQL":"MySQL",
  "MariaDB and MySQL are the same thing here - the app speaks one protocol to both. Pick whichever your NAS actually runs.":
    "MariaDB und MySQL sind hier dasselbe – die App spricht mit beiden dasselbe Protokoll. Nimm das, was auf deinem NAS tatsächlich läuft.",
  "127.0.0.1 means the machine running this app - the NAS itself, not the computer you are reading this on. Change it only if the database is on a different machine.":
    "127.0.0.1 bedeutet: der Rechner, auf dem diese App läuft – also das NAS selbst, nicht der Computer, an dem du gerade sitzt. Nur ändern, wenn die Datenbank auf einem anderen Rechner liegt.",
  "SQLite (a single file, no server)":"SQLite (eine Datei, kein Server)",
  "Host":"Host", "Port":"Port", "User":"Benutzer", "Password":"Passwort", "Database name":"Datenbankname",
  "File":"Datei",
  "Relative names are resolved against the app folder.":
    "Relative Namen gelten ab dem App-Ordner.",
  "Which printer to watch":"Welcher Drucker beobachtet wird",
  "All three come from the printer itself: Settings › Network on its screen.":
    "Alle drei stehen am Drucker selbst: Einstellungen › Netzwerk auf dem Display.",
  "Optional. Skip anything you do not have — you can switch it on later.":
    "Optional. Was du nicht hast, einfach überspringen – lässt sich später einschalten.",
  "Everything that is optional":"Alles Optionale",
  "What a print costs":"Was ein Druck kostet",
  "Used to price every print. Rough numbers are fine; they can be corrected per spool later.":
    "Damit wird jeder Druck bepreist. Ungefähre Werte reichen – pro Spule lässt sich das später korrigieren.",
  "leave empty to keep the stored one":"leer lassen, um das gespeicherte zu behalten",
  "set":"gesetzt", "not set":"nicht gesetzt",
  "+ Add row":"+ Zeile", "remove":"Entfernen", "name":"Name", "value":"Wert",
  "Saving…":"Speichere…",
  "Set up. The app is restarting — this page reloads by itself.":
    "Fertig eingerichtet. Die App startet neu – diese Seite lädt von selbst.",
  "Your old printer.config.json was read to fill this in. When you finish, its contents move into the database and the file is renamed — you will not need to edit it again.":
    "Deine bisherige printer.config.json wurde ausgelesen, um das hier vorauszufüllen. Beim Fertigstellen wandert ihr Inhalt in die Datenbank und die Datei wird umbenannt – du musst sie nie wieder bearbeiten.",
  "Nothing is saved until the last page, so you can go back and change anything.":
    "Gespeichert wird erst auf der letzten Seite – du kannst jederzeit zurück und alles ändern.",
  // schema labels
  "Printer IP":"Drucker-IP","Serial":"Seriennummer","LAN access code":"LAN-Zugangscode","Model":"Modell",
  "Currency":"Währung","Electricity price per kWh":"Strompreis pro kWh",
  "Default price per kg":"Standardpreis pro kg","Bambu, per material":"Bambu, je Material",
  "Third-party, per material":"Fremdhersteller, je Material","Override by material":"Überschreiben je Material",
  "Override by AMS slot":"Überschreiben je AMS-Slot","Override by SKU":"Überschreiben je SKU",
  "Price from imported invoices":"Preis aus importierten Rechnungen",
  "Low-stock threshold %":"Schwelle „wenig übrig“ %","Store region":"Store-Region",
  "Store address override":"Store-Adresse überschreiben","Extra colour names":"Zusätzliche Farbnamen",
  "Allow assigning AMS slots":"AMS-Slots zuweisen erlauben","Allow sending G-code":"G-Code senden erlauben",
  "Telemetry sample interval (s)":"Messintervall (s)","Keep telemetry for (days)":"Messdaten aufbewahren (Tage)",
  "Keep recording after a print (min)":"Nachlauf nach dem Druck (min)",
  "A counter that only goes up. Today and this month are worked out from it.":"Ein Zähler, der nur steigt. Heute und dieser Monat werden daraus berechnet.",
  "Broker address":"Broker-Adresse",
  "Broker password":"Broker-Passwort",
  "Broker port":"Broker-Port",
  "Broker user":"Broker-Benutzer",
  "Broker uses TLS":"Broker nutzt TLS",
  "Energy unit":"Energie-Einheit",
  "Field: energy total":"Feld: Energie gesamt",
  "Field: watts":"Feld: Watt",
  "Key in the message holding the current draw. 'power' for Zigbee2MQTT; nested keys are written with dots.":"Schlüssel in der Nachricht mit der aktuellen Leistung. Bei Zigbee2MQTT „power“; verschachtelte Schlüssel mit Punkten.",
  "Leave empty if the broker allows anonymous.":"Leer lassen, wenn der Broker anonym erlaubt.",
  "Meter":"Messgerät",
  "Power monitoring enabled":"Strommessung aktiv",
  "The plug's own topic, e.g. zigbee2mqtt/printer. tools/sniff_power_mqtt.py lists what a broker is publishing.":"Das Topic der Steckdose, z. B. zigbee2mqtt/drucker. tools/sniff_power_mqtt.py zeigt, was ein Broker veröffentlicht.",
  "Topic":"Topic",
  "Where Zigbee2MQTT / Home Assistant publishes. Often the same machine as this app.":"Wo Zigbee2MQTT / Home Assistant veröffentlicht. Oft derselbe Rechner wie diese App.",
  "tapo = TP-Link P110/P115 over WiFi. mqtt = anything publishing to a broker: Zigbee2MQTT (IKEA INSPELNING and other Zigbee plugs), Shelly, Tasmota, Home Assistant.":"tapo = TP-Link P110/P115 über WLAN. mqtt = alles, was an einen Broker sendet: Zigbee2MQTT (IKEA INSPELNING und andere Zigbee-Steckdosen), Shelly, Tasmota, Home Assistant.",
  "Smart plug enabled":"Smart Plug aktiv","Plug IP":"Plug-IP","Plug model":"Plug-Modell",
  "Tapo account":"Tapo-Konto","Tapo password":"Tapo-Passwort","Poll every (s)":"Abfrage alle (s)",
  "Bambu Cloud enabled":"Bambu Cloud aktiv","Bambu account":"Bambu-Konto","Bambu password":"Bambu-Passwort",
  "Cloud token":"Cloud-Token","Sync every (min)":"Sync alle (min)",
  "Camera enabled":"Kamera aktiv","Stream name":"Streamname","RTSP port":"RTSP-Port",
  "go2rtc port":"go2rtc-Port","WebRTC port":"WebRTC-Port","go2rtc binary":"go2rtc-Programm",
  "Power":"Strom","Cloud":"Cloud","Camera":"Kamera","Cost":"Kosten","Filament":"Filament",
  // schema help
  "LAN address of the printer. Reconnects on restart.":"LAN-Adresse des Druckers. Verbindet beim Neustart neu.",
  "From the printer's screen: Settings > Network.":"Am Druckerdisplay: Einstellungen > Netzwerk.",
  "Used when no more specific rule matches.":"Gilt, wenn keine genauere Regel passt.",
  "Price per kg for genuine spools, by material. 'default' catches the rest.":
    "Preis pro kg für Original-Spulen, je Material. „default“ fängt den Rest ab.",
  "Beats the brand tables. Rarely needed.":"Schlägt die Markentabellen. Selten nötig.",
  "Genuine spools are priced from your own orders, list price, ahead of the tables above.":
    "Original-Spulen werden aus deinen Bestellungen bepreist – Listenpreis, vor den Tabellen oben.",
  "Which Bambu store the Reorder link points at.":"Auf welchen Bambu-Store der Nachbestellen-Link zeigt.",
  "Leave empty unless the region list has the wrong address for you.":
    "Leer lassen, außer die Regionsliste hat die falsche Adresse.",
  "Hex code to name, for colours the built-in list gets wrong.":
    "Hex-Code zu Name, für Farben, die die eingebaute Liste falsch benennt.",
  "Rejected by current firmware (HMS 0500_0500_0001_0007).":
    "Von der aktuellen Firmware abgelehnt (HMS 0500_0500_0001_0007).",
  "Sends raw G-code to the printer. Rejected by current firmware, and this page has no login - leave off unless you need it.":
    "Sendet rohen G-Code an den Drucker. Von der Firmware abgelehnt – aus lassen, wenn du ihn nicht brauchst.",
  "Filled in automatically after a successful sign-in.":"Wird nach erfolgreicher Anmeldung automatisch gefüllt.",
  "Relative to the app folder. The default is the Synology's ARM64 build.":
    "Relativ zum App-Ordner. Standard ist der ARM64-Build für die Synology.",
};
let lang = localStorage.getItem("bambu-lang") || "de";
const t = s => (lang === "de" && DE[s]) || s;

let seed = null, step = 0, values = {}, db = null;
const val = {};                      // path -> current form value

// ---- rendering -------------------------------------------------------------
function fieldsFor(key){ return seed.fields.filter(f => f.step === key); }

function control(f){
  const v = val[f.path];
  const id = "f_" + f.path.replace(/\./g, "_");
  if(f.kind === "bool")
    return `<input type="checkbox" id="${id}" data-path="${esc(f.path)}"${v ? " checked" : ""}>`;
  if(f.kind === "select")
    return `<select id="${id}" data-path="${esc(f.path)}">${
      f.options.map(o => `<option value="${esc(o)}"${o === v ? " selected" : ""}>${
        esc(t((f.option_labels || {})[o] || o))}</option>`).join("")}</select>`;
  if(f.kind === "matrix" || f.kind === "pairs"){
    const num = f.kind === "matrix";
    const rows = Object.entries(v || {});
    return `<div class="mtx" data-path="${esc(f.path)}" data-num="${num ? 1 : 0}">${
      rows.map(([k, x]) => mtxRow(k, x, num)).join("")}</div>
      <button type="button" class="btn small mtx-add">${t("+ Add row")}</button>`;
  }
  if(f.kind === "secret"){
    const ph = seed.is_set[f.path] ? t("leave empty to keep the stored one") : "";
    return `<input type="password" id="${id}" data-path="${esc(f.path)}"
      value="${esc(v || "")}" placeholder="${esc(ph)}" autocomplete="new-password">`;
  }
  const num = f.kind === "int" || f.kind === "money" || f.kind === "float";
  return `<input type="text" id="${id}" data-path="${esc(f.path)}"${
    num ? ' inputmode="decimal"' : ""} value="${esc(v == null ? "" : v)}">`;
}

function mtxRow(k, v, num){
  return `<div class="mtx-row">
    <input value="${esc(k)}" placeholder="${esc(t("name"))}">
    <input value="${esc(v)}" placeholder="${esc(t("value"))}"${num ? ' inputmode="decimal"' : ""}>
    <button type="button" class="btn small mtx-x" title="${esc(t("remove"))}">✕</button></div>`;
}

// the same dependency the Settings page honours: with the meter set to MQTT,
// the Tapo boxes are not questions worth asking
function visible(f){
  if(!f.show_if) return true;
  const [path, want] = f.show_if;
  return String(val[path]) === String(want);
}

function schemaStep(key){
  let html = "", group = null;
  for(const f of fieldsFor(key).filter(visible)){
    if(f.group !== group && fieldsFor(key).filter(visible).some(x => x.group !== f.group)){
      group = f.group;
      html += `<div class="grp">${esc(t(group))}</div>`;
    }
    const help = f.help ? `<div class="note">${esc(t(f.help))}</div>` : "";
    const restart = f.live ? "" : "";
    html += `<div class="row"><label for="f_${esc(f.path.replace(/\./g, "_"))}"${
      f.danger ? ' style="color:var(--danger)"' : ""}>${esc(t(f.label))}</label>
      <div>${control(f)}${help}${restart}</div></div>`;
  }
  return html;
}

// what each backend is called in the dropdown; the list itself comes from the
// server, so a backend added to storage.DIALECTS appears here on its own
const BACKEND_LABEL = {
  mariadb: "MariaDB",
  mysql: "MySQL",
  sqlite: "SQLite (a single file, no server)",
};

function dbStep(){
  const m = db[db.backend] || db.mariadb || {};
  const server = db.backend !== "sqlite";
  const list = (seed.backends || ["mariadb", "sqlite"]);
  return `
    <div class="row"><label>${esc(t("Database"))}</label><div>
      <select id="dbBackend">${list.map(b=>
        `<option value="${esc(b)}"${b === db.backend ? " selected" : ""}>${
          esc(t(BACKEND_LABEL[b] || b))}</option>`).join("")}
      </select>
      <div class="note">${esc(t("MariaDB and MySQL are the same thing here - the app speaks one protocol to both. Pick whichever your NAS actually runs."))}</div>
      </div></div>
    <div id="dbMaria" class="${server ? "" : "hide"}">
      <div class="row"><label>${esc(t("Host"))}</label><div>
        <div class="pair">
          <input type="text" id="dbHost" value="${esc(m.host || "127.0.0.1")}">
          <input type="text" inputmode="numeric" id="dbPort" value="${esc(m.port || 3306)}">
        </div>
        <div class="note">${esc(t("127.0.0.1 means the machine running this app - the NAS itself, not the computer you are reading this on. Change it only if the database is on a different machine."))}</div>
      </div></div>
      <div class="row"><label>${esc(t("User"))}</label><div>
        <input type="text" id="dbUser" value="${esc(m.user || "")}"></div></div>
      <div class="row"><label>${esc(t("Password"))}</label><div>
        <input type="password" id="dbPass" value="" autocomplete="new-password"
          placeholder="${seed.is_set["db.password"] ? esc(t("leave empty to keep the stored one")) : ""}">
        </div></div>
      <div class="row"><label>${esc(t("Database name"))}</label><div>
        <input type="text" id="dbName" value="${esc(m.database || "bambu_monitor")}"></div></div>
    </div>
    <div class="row"><label>${esc(t("Stored in"))}</label><div>
      <div class="note" style="margin-top:9px"><code>${esc(seed.config_path || "")}</code>
      <div style="margin-top:5px">${esc(t("This follows the app folder - move the app and the file moves with it. Nothing else is written outside the database."))}</div>
      </div></div></div>
    <div id="dbSqlite" class="${server ? "hide" : ""}">
      <div class="row"><label>${esc(t("File"))}</label><div>
        <input type="text" id="dbPath" value="${esc(db.sqlite_path || "telemetry.db")}">
        <div class="note">${esc(t("Relative names are resolved against the app folder."))}</div>
      </div></div>
    </div>`;
}

const LEDE = {
  db:      ["Where everything is stored",
            "This is the one thing that cannot live in the database, so it is written to a small file the app creates for you. Everything else on the following pages goes into the database and can be changed later from the Settings page."],
  printer: ["Which printer to watch",
            "All three come from the printer itself: Settings › Network on its screen."],
  extras:  ["Everything that is optional",
            "Optional. Skip anything you do not have — you can switch it on later."],
  costs:   ["What a print costs",
            "Used to price every print. Rough numbers are fine; they can be corrected per spool later."],
  recording: ["How much is recorded, and what the app may do",
            "The defaults suit a printer in regular use. The two switches at the bottom stay off unless you have a reason."],
};

function render(){
  const s = seed.steps[step];
  $("rail").innerHTML = seed.steps.map((x, i) =>
    `<div class="${i === step ? "on" : (i < step ? "done" : "")}"><span>${
      i < step ? "✓" : i + 1}</span>${esc(t(x.title))}</div>`).join("");
  $("stepTitle").textContent = t(LEDE[s.key][0]);
  $("stepLede").textContent  = t(LEDE[s.key][1]);
  $("stepBody").innerHTML = s.key === "db" ? dbStep() : schemaStep(s.key);
  $("stepMsg").className = "msg"; $("stepMsg").textContent = "";
  if(step === 0 && seed.legacy_path) note("warn", t("Your old printer.config.json was read to fill this in. When you finish, its contents move into the database and the file is renamed — you will not need to edit it again."));
  else if(step === 0) note("", t("Nothing is saved until the last page, so you can go back and change anything."));
  $("backBtn").classList.toggle("hide", step === 0);
  $("backBtn").textContent = t("Back");
  const last = step === seed.steps.length - 1;
  $("nextBtn").textContent = last ? t("Finish") : t("Next");
  $("testBtn").classList.toggle("hide", !(s.key === "db" || s.key === "printer"));
  $("testBtn").textContent = s.key === "db" ? t("Test connection") : t("Test printer");
  window.scrollTo(0, 0);
}

function note(kind, text){
  const el = $("stepMsg");
  el.className = "msg" + (kind ? " " + kind : "");
  el.textContent = text;
}

// ---- reading the form back -------------------------------------------------
function collect(){
  for(const el of $("stepBody").querySelectorAll("[data-path]")){
    if(el.classList.contains("mtx")) continue;
    val[el.dataset.path] = el.type === "checkbox" ? el.checked : el.value;
  }
  for(const mtx of $("stepBody").querySelectorAll(".mtx")){
    const out = {}, num = mtx.dataset.num === "1";
    for(const row of mtx.querySelectorAll(".mtx-row")){
      const k = row.children[0].value.trim(), v = row.children[1].value.trim();
      if(k) out[k] = num ? v : v;
    }
    val[mtx.dataset.path] = out;
  }
  if(seed.steps[step].key === "db") collectDb();
}

function collectDb(){
  const backend = $("dbBackend").value;
  // the connection block is keyed by the backend's own name, so switching the
  // dropdown cannot leave a stale block behind under the old one
  db = backend === "sqlite"
    ? {backend: "sqlite", sqlite_path: $("dbPath").value.trim() || "telemetry.db"}
    : {backend, [backend]: {
        host: $("dbHost").value.trim(), port: +$("dbPort").value || 3306,
        user: $("dbUser").value.trim(), password: $("dbPass").value,
        database: $("dbName").value.trim()}};
}

// ---- actions ---------------------------------------------------------------
async function post(url, body){
  const r = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json"},
                              body: JSON.stringify(body)});
  return r.json();
}

async function test(){
  collect();
  const key = seed.steps[step].key;
  $("testBtn").disabled = true; $("testBtn").textContent = t("Testing…");
  try{
    const r = key === "db"
      ? await post("/setup/test-db", {db})
      : await post("/setup/test-printer", {ip: val.ip, serial: val.serial,
                                           access_code: val.access_code});
    note(r.ok ? "ok" : "bad", (r.ok ? "✓ " : "✕ ") + r.message);
  }catch(e){ note("bad", String(e)); }
  $("testBtn").disabled = false;
  $("testBtn").textContent = seed.steps[step].key === "db" ? t("Test connection") : t("Test printer");
}

async function next(){
  collect();
  if(step < seed.steps.length - 1){ step++; render(); return; }
  $("nextBtn").disabled = true; $("nextBtn").textContent = t("Saving…");
  try{
    const r = await post("/setup/finish", {db, values: val});
    if(r.ok){
      note("ok", t("Set up. The app is restarting — this page reloads by itself."));
      $("backBtn").classList.add("hide"); $("testBtn").classList.add("hide");
      $("nextBtn").classList.add("hide");
      setTimeout(function again(){
        fetch("/api/state").then(r => r.ok ? location.replace("/") : setTimeout(again, 1500))
                           .catch(() => setTimeout(again, 1500));
      }, 2500);
      return;
    }
    if(r.errors) note("bad", r.errors.join("\n"));
    else note("bad", (r.where === "db" ? t("Database") + ": " : "") + (r.error || "?"));
  }catch(e){ note("bad", String(e)); }
  $("nextBtn").disabled = false; $("nextBtn").textContent = t("Finish");
}

// ---- wiring ----------------------------------------------------------------
$("backBtn").addEventListener("click", ()=>{ collect(); step--; render(); });
$("nextBtn").addEventListener("click", next);
$("testBtn").addEventListener("click", test);
$("langSeg").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  lang = b.dataset.lang; localStorage.setItem("bambu-lang", lang);
  document.documentElement.lang = lang;
  for(const x of $("langSeg").children) x.classList.toggle("on", x.dataset.lang === lang);
  $("lede").textContent = t("Setup");
  collect(); render();
});
$("stepBody").addEventListener("click", e=>{
  if(e.target.classList.contains("mtx-x")){ e.target.closest(".mtx-row").remove(); return; }
  if(e.target.classList.contains("mtx-add")){
    const mtx = e.target.previousElementSibling;
    mtx.insertAdjacentHTML("beforeend", mtxRow("", "", mtx.dataset.num === "1"));
    mtx.lastElementChild.querySelector("input").focus();
  }
});
$("stepBody").addEventListener("change", e=>{
  // a field others depend on: redraw so the right boxes appear at once
  const p = e.target.dataset && e.target.dataset.path;
  if(p && (seed.fields || []).some(f => f.show_if && f.show_if[0] === p)){
    collect();
    render();
    return;
  }
  if(e.target.id === "dbBackend"){
    const server = e.target.value !== "sqlite";
    $("dbMaria").classList.toggle("hide", !server);
    $("dbSqlite").classList.toggle("hide", server);
    $("testBtn").disabled = false;      // a different server needs a new test
  }
});

fetch("/setup/seed").then(r => r.json()).then(s=>{
  seed = s; db = s.db;
  Object.assign(val, s.values);
  for(const x of $("langSeg").children) x.classList.toggle("on", x.dataset.lang === lang);
  document.documentElement.lang = lang;
  $("lede").textContent = t("Setup");
  render();
});
</script>
</body>
</html>
